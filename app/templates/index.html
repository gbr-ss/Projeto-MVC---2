<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema MVC</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f10;
            --surface: #1a1a1e;
            --border: #2a2a30;
            --text: #e8e8ec;
            --muted: #7a7a88;
            --accent: #c8a96e;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
            animation: fadeUp .5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: var(--accent);
            letter-spacing: -.5px;
            margin-bottom: .5rem;
        }

        p {
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: .75rem;
        }

        a {
            text-decoration: none;
            padding: .85rem;
            border-radius: 10px;
            font-size: .95rem;
            font-weight: 500;
            transition: all .2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #0f0f10;
        }
        .btn-primary:hover { filter: brightness(1.1); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { background: var(--border); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Sistema MVC</div>
        <p>Faça login para acessar o sistema</p>
        <div class="actions">
            <a href="/auth/login" class="btn-primary">Entrar</a>
            <a href="/auth/cadastro" class="btn-secondary">Criar conta</a>
        </div>
    </div>
</body>
</html>
