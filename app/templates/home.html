<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Estoque</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f10;
            --surface: #1a1a1e;
            --border: #2a2a30;
            --text: #e8e8ec;
            --muted: #7a7a88;
            --accent: #c8a96e;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            animation: fadeUp .5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .greeting {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: .4rem;
        }

        .badge {
            display: inline-block;
            background: rgba(200,169,110,.12);
            border: 1px solid rgba(200,169,110,.25);
            color: var(--accent);
            font-size: .78rem;
            font-weight: 500;
            padding: .25rem .75rem;
            border-radius: 999px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: .07em;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        /* Estilização para a lista de navegação/botões */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-link {
            display: block;
            text-align: center;
            padding: .85rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            font-size: .9rem;
            font-weight: 500;
            transition: all .2s;
        }

        .btn-link:hover {
            border-color: var(--accent);
            background: rgba(200, 169, 110, 0.05);
        }

        a.logout {
            display: block;
            text-align: center;
            padding: .85rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: .9rem;
            transition: all .2s;
            margin-top: 0.5rem;
        }

        a.logout:hover {
            border-color: var(--error, #e07060);
            color: #e07060;
            background: rgba(224, 112, 96, 0.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="greeting">Olá, {{ usuario.nome }}</div>
        <span class="badge">{{ usuario.role }}</span>
        
        <hr class="divider">
        
        <div class="nav-links">
            <a href="/usuarios" class="btn-link">Gerenciar Usuários</a>
            
            <a href="/auth/logout" class="logout">Sair da conta</a>
        </div>
    </div>

</body>
</html>
