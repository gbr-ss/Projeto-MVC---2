<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sistema MVC</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f10;
            --surface: #1a1a1e;
            --border: #2a2a30;
            --text: #e8e8ec;
            --muted: #7a7a88;
            --accent: #c8a96e;
            --error: #e07060;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 380px;
            animation: fadeUp .5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: .4rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: .85rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: .4rem;
            margin-bottom: 1.2rem;
        }

        label {
            font-size: .8rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .75rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s;
        }
        input:focus { border-color: var(--accent); }

        .sucesso {
            background: rgba(80,180,120,.12);
            border: 1px solid rgba(80,180,120,.3);
            color: #5ab47a;
            font-size: .85rem;
            padding: .65rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
        }

        .erro {
            background: rgba(224,112,96,.12);
            border: 1px solid rgba(224,112,96,.3);
            color: var(--error);
            font-size: .85rem;
            padding: .65rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
        }

        button {
            width: 100%;
            padding: .9rem;
            background: var(--accent);
            color: #0f0f10;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 500;
            cursor: pointer;
            transition: filter .2s;
            margin-top: .4rem;
        }
        button:hover { filter: brightness(1.1); }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .85rem;
            color: var(--muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">Bem-vindo</div>
        <div class="subtitle">Entre com suas credenciais</div>

        <form action="/auth/login" method="post">
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••">
            </div>

            {% if request.query_params.get("cadastro") == "ok" %}
                <div class="sucesso">Cadastro realizado! Faça login.</div>
            {% endif %}

            {% if erro %}
                <div class="erro">{{ erro }}</div>
            {% endif %}

            <button type="submit">Entrar</button>
        </form>

        <div class="footer">
            Não tem conta? <a href="/auth/cadastro">Cadastrar</a>
        </div>
    </div>
</body>
</html>
